<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Research Co-helper</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Marked.js for Markdown parsing in chat -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* Custom scrollbar for a cleaner UI */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Markdown Prose Styling */
        .prose p { margin-bottom: 0.75em; line-height: 1.6; }
        .prose p:last-child { margin-bottom: 0; }
        .prose ul { list-style-type: disc; margin-left: 1.5em; margin-bottom: 0.75em; }
        .prose ol { list-style-type: decimal; margin-left: 1.5em; margin-bottom: 0.75em; }
        .prose a { color: #2563eb; text-decoration: underline; }
        .prose strong { font-weight: 600; color: inherit; }
        .prose h1, .prose h2, .prose h3 { font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; color: inherit; }
        .prose code { background: #f1f5f9; padding: 0.2em 0.4em; border-radius: 4px; font-size: 0.9em; font-family: monospace; color: #0f172a; }
        
        /* Ensure user message text remains white in prose */
        .prose-user * { color: #ffffff !important; }
    </style>
</head>
<body class="flex flex-col h-screen bg-slate-50 text-slate-800 font-sans overflow-hidden">

    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-10 shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Navigation Links -->
                <nav class="flex space-x-1 sm:space-x-4" id="nav-tabs">
                    <button onclick="switchTab('cases')" id="tab-cases" class="flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-all duration-200 bg-blue-50 text-blue-700 shadow-sm ring-1 ring-blue-100">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Cases</span>
                    </button>
                    <button onclick="switchTab('research')" id="tab-research" class="flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-all duration-200 text-slate-600 hover:bg-slate-100 hover:text-slate-900">
                        <i data-lucide="search" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Research</span>
                    </button>
                    <button onclick="switchTab('resources')" id="tab-resources" class="flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-all duration-200 text-slate-600 hover:bg-slate-100 hover:text-slate-900">
                        <i data-lucide="folder" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Resources</span>
                    </button>
                    <button onclick="switchTab('drafting')" id="tab-drafting" class="flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-all duration-200 text-slate-600 hover:bg-slate-100 hover:text-slate-900">
                        <i data-lucide="file-text" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Drafting</span>
                    </button>
                </nav>

                <!-- User Profile & Active Case Status -->
                <div class="flex items-center gap-4">
                    <div id="active-case-indicator" class="hidden md:flex items-center gap-2 text-xs text-slate-600 bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-full">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        <span class="font-semibold">Active:</span>
                        <span id="active-case-name" class="max-w-[120px] truncate"></span>
                    </div>
                    <div class="h-8 w-8 rounded-full bg-slate-800 flex items-center justify-center border-2 border-white shadow-sm cursor-pointer hover:ring-2 hover:ring-slate-300 transition-all">
                        <i data-lucide="user" class="text-white w-4 h-4"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-hidden p-0 bg-slate-50 relative">
        <div id="main-content" class="w-full h-full relative">
            <!-- Dynamic content will be injected here -->
        </div>
    </main>

    <script>
        // --- Application State ---
        const state = {
            activeTab: 'cases',
            selectedCase: null,
            cases: [
                { id: 1, title: "Smith v. Jones (Property Dispute)", status: "Active", lastUpdated: "2026-07-28" },
                { id: 2, title: "Estate of Doe", status: "Pending", lastUpdated: "2026-07-25" },
            ],
            mockDocuments: [
                { id: 1, name: "Initial_Complaint.pdf", type: "PDF", date: "2026-07-01" },
                { id: 2, name: "Defendant_Response.docx", type: "Word", date: "2026-07-15" },
                { id: 3, name: "Contract_Addendum.pdf", type: "PDF", date: "2026-07-18" },
            ],
            chatMessages: [
                { role: 'model', text: 'Hello. I am your Legal Research Co-helper. I have access to real-time information via Google Search. How can I assist you with this matter?' }
            ],
            attachedDocs: [],
            isChatLoading: false,
            showResources: false,
            isCreatingCase: false,
            draftNotes: '',
            draftOutput: '',
            isDrafting: false
        };

        // --- Core Rendering & Navigation ---
        function initApp() {
            renderContent();
            updateHeaderUI();
        }

        function switchTab(tabId) {
            state.activeTab = tabId;
            updateHeaderUI();
            renderContent();
        }

        function updateHeaderUI() {
            // Update Active Case Indicator
            const indicator = document.getElementById('active-case-indicator');
            const caseNameEl = document.getElementById('active-case-name');
            if (state.selectedCase) {
                indicator.classList.remove('hidden');
                indicator.classList.add('flex');
                caseNameEl.textContent = state.selectedCase.title;
            } else {
                indicator.classList.add('hidden');
                indicator.classList.remove('flex');
            }

            // Update Tab Styling
            const tabs = ['cases', 'research', 'resources', 'drafting'];
            tabs.forEach(tab => {
                const el = document.getElementById(`tab-${tab}`);
                if (!el) return;
                if (tab === state.activeTab) {
                    el.className = 'flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-all duration-200 bg-blue-50 text-blue-700 shadow-sm ring-1 ring-blue-100';
                } else {
                    el.className = 'flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-all duration-200 text-slate-600 hover:bg-slate-100 hover:text-slate-900';
                }
            });
        }

        function renderContent() {
            const container = document.getElementById('main-content');
            
            if (state.activeTab === 'cases') {
                container.innerHTML = getCasesHTML();
            } else if (state.activeTab === 'research') {
                if (!state.selectedCase) {
                    container.innerHTML = getNoCaseHTML("Please select a case to start researching.");
                } else {
                    container.innerHTML = getResearchHTML();
                    renderChatMessages();
                    updateResourcesPopoverUI();
                    updateAttachedDocsUI();
                }
            } else if (state.activeTab === 'resources') {
                if (!state.selectedCase) {
                    container.innerHTML = getNoCaseHTML("Please select a case to manage resources.");
                } else {
                    container.innerHTML = getResourcesHTML();
                }
            } else if (state.activeTab === 'drafting') {
                if (!state.selectedCase) {
                    container.innerHTML = getNoCaseHTML("Please select a case to begin drafting.");
                } else {
                    container.innerHTML = getDraftingHTML();
                }
            }
            
            lucide.createIcons();
        }

        function getNoCaseHTML(message) {
            return `
                <div class="flex flex-col items-center justify-center h-full text-slate-500 gap-4 bg-white rounded-2xl border border-slate-200 shadow-sm p-8 max-w-md mx-auto mt-10">
                    <div class="bg-slate-50 p-4 rounded-full">
                        <i data-lucide="folder-open" class="w-12 h-12 text-slate-400"></i>
                    </div>
                    <p class="text-lg text-center font-medium text-slate-700">${message}</p>
                    <button onclick="switchTab('cases')" class="mt-4 px-6 py-2 bg-slate-900 text-white rounded-lg hover:bg-slate-800 transition-colors shadow-sm">
                        Go to Case Directory
                    </button>
                </div>
            `;
        }

        function getCasesHTML() {
            let html = `
                <div class="space-y-8 animate-in fade-in duration-300 overflow-y-auto h-full pb-10 pr-2">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4">
                        <div>
                            <h2 class="text-3xl font-bold text-slate-900 tracking-tight">Case Directory</h2>
                            <p class="text-slate-500 mt-1">Manage matters, upload resources, and start AI-assisted research.</p>
                        </div>
                        <button onclick="toggleCreateCase()" class="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-lg font-medium transition-all shadow-md hover:shadow-lg transform active:scale-95">
                            <i data-lucide="plus" class="w-5 h-5"></i> New Matter
                        </button>
                    </div>
            `;

            if (state.isCreatingCase) {
                html += `
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-lg shadow-slate-200/50 animate-in fade-in slide-in-from-top-4">
                        <form onsubmit="handleCreateCase(event)" class="flex flex-col sm:flex-row gap-4 items-end">
                            <div class="flex-1 w-full space-y-2">
                                <label class="text-sm font-semibold text-slate-700">Matter Name / Reference</label>
                                <input type="text" id="new-case-title" placeholder="e.g., Doe Estate Planning or Project Alpha" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none bg-slate-50 focus:bg-white transition-colors" autofocus required>
                            </div>
                            <div class="flex gap-2 w-full sm:w-auto">
                                <button type="button" onclick="toggleCreateCase()" class="flex-1 sm:flex-none px-6 py-2.5 rounded-xl font-medium text-slate-600 hover:bg-slate-100 transition-colors">Cancel</button>
                                <button type="submit" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-medium transition-colors shadow-sm">Create</button>
                            </div>
                        </form>
                    </div>
                `;
            }

            html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
            
            state.cases.forEach(c => {
                const isActive = state.selectedCase?.id === c.id;
                const statusClass = c.status === 'Active' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700';
                const cardClass = isActive ? 'border-blue-500 ring-2 ring-blue-500/20 shadow-md' : 'border-slate-200';
                
                html += `
                    <div class="bg-white rounded-2xl border transition-all duration-300 hover:shadow-xl hover:-translate-y-1 flex flex-col group ${cardClass}">
                        <div class="p-6 flex-1">
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-md ${statusClass}">${c.status}</span>
                                <span class="text-xs font-medium text-slate-400 bg-slate-50 px-2 py-1 rounded-md">Updated ${c.lastUpdated}</span>
                            </div>
                            <h3 class="font-bold text-xl text-slate-900 mb-2 line-clamp-2 group-hover:text-blue-700 transition-colors">${c.title}</h3>
                        </div>
                        <div class="border-t border-slate-100 p-4 bg-gradient-to-b from-transparent to-slate-50 rounded-b-2xl flex justify-between items-center mt-auto">
                            <div class="text-sm font-medium text-slate-500 flex items-center gap-1.5">
                                <div class="p-1.5 bg-white rounded-md shadow-sm border border-slate-100"><i data-lucide="folder-open" class="w-3.5 h-3.5 text-slate-400"></i></div> 2 Docs
                            </div>
                            <button onclick="openCase(${c.id})" class="flex items-center gap-1 text-sm font-semibold text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition-colors">
                                Open <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            return html;
        }

        function toggleCreateCase() {
            state.isCreatingCase = !state.isCreatingCase;
            renderContent();
        }

        function handleCreateCase(e) {
            e.preventDefault();
            const input = document.getElementById('new-case-title');
            if (!input.value.trim()) return;
            
            const newCase = {
                id: Date.now(),
                title: input.value.trim(),
                status: 'Active',
                lastUpdated: new Date().toISOString().split('T')[0]
            };
            
            state.cases.unshift(newCase);
            state.isCreatingCase = false;
            renderContent();
        }

        function getResourcesHTML() {
            let html = `
                <div class="h-full flex flex-col animate-in fade-in duration-300">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Case Resources</h2>
                            <p class="text-slate-500 mt-1">Manage documents and reference materials for <strong>${state.selectedCase.title}</strong>.</p>
                        </div>
                        <div>
                            <input type="file" id="file-upload" class="hidden" multiple onchange="handleFileUpload(event)">
                            <button onclick="document.getElementById('file-upload').click()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium transition-all shadow-sm">
                                <i data-lucide="upload" class="w-5 h-5"></i> Upload Files
                            </button>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex-1 flex flex-col">
                        <div class="overflow-y-auto flex-1 p-0">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-50 sticky top-0 z-10 border-b border-slate-200">
                                    <tr>
                                        <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Document Name</th>
                                        <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider w-32">Type</th>
                                        <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider w-40">Date Added</th>
                                        <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right w-24">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
            `;

            if (state.mockDocuments.length === 0) {
                html += `
                    <tr>
                        <td colspan="4" class="px-6 py-16 text-center text-slate-500 bg-slate-50/30">
                            <div class="flex flex-col items-center justify-center">
                                <div class="bg-white p-4 rounded-full mb-4 shadow-sm border border-slate-100">
                                    <i data-lucide="file-dashed" class="w-8 h-8 text-slate-400"></i>
                                </div>
                                <p class="font-medium text-slate-600">No resources found.</p>
                                <p class="text-sm mt-1">Upload documents to reference them in your research.</p>
                            </div>
                        </td>
                    </tr>
                `;
            } else {
                state.mockDocuments.forEach(doc => {
                    html += `
                        <tr class="hover:bg-slate-50/80 transition-colors group">
                            <td class="px-6 py-4 flex items-center gap-3">
                                <div class="p-2 bg-blue-50/50 border border-blue-100 text-blue-600 rounded-lg">
                                    <i data-lucide="file-text" class="w-4 h-4"></i>
                                </div>
                                <span class="font-medium text-slate-700 truncate max-w-sm">${doc.name}</span>
                            </td>
                            <td class="px-6 py-4 text-sm text-slate-500">
                                <span class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded text-xs font-medium">${doc.type}</span>
                            </td>
                            <td class="px-6 py-4 text-sm text-slate-500">${doc.date}</td>
                            <td class="px-6 py-4 text-right">
                                <button onclick="handleDeleteDocument(${doc.id})" class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors opacity-0 group-hover:opacity-100 focus:opacity-100" title="Delete">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            return html;
        }

        function handleFileUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                let ext = file.name.split('.').pop().toUpperCase();
                if (ext === file.name.toUpperCase()) ext = 'DOC';
                
                const newDoc = {
                    id: Date.now() + Math.random(), 
                    name: file.name,
                    type: ext,
                    date: new Date().toISOString().split('T')[0]
                };
                state.mockDocuments.push(newDoc);
            });
            
            event.target.value = '';
            
            renderContent();
            updateResourcesPopoverUI();
        }

        function handleDeleteDocument(id) {
            state.mockDocuments = state.mockDocuments.filter(d => d.id !== id);
            state.attachedDocs = state.attachedDocs.filter(d => d.id !== id);
            
            renderContent();
            updateResourcesPopoverUI();
            updateAttachedDocsUI();
        }

        function openCase(id) {
            const selected = state.cases.find(c => c.id === id);
            if (selected) {
                state.selectedCase = selected;
                // Reset chat when opening a new case
                state.chatMessages = [{ role: 'model', text: `Hello. I am your Legal Research Co-helper. I have access to real-time information via Google Search. How can I assist you with **${selected.title}**?` }];
                state.attachedDocs = [];
                switchTab('research');
            }
        }

        function getResearchHTML() {
            // Note: Header removed, chat container takes full space, removed container styling for full width/height immersion
            return `
                <div class="h-full flex flex-col animate-in fade-in duration-300 w-full h-full">
                    <div class="flex-1 flex flex-col relative w-full h-full overflow-hidden">
                        
                        <!-- Messages Area -->
                        <div id="chat-messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 scroll-smooth">
                            <!-- Messages will be injected here -->
                        </div>
                        
                        <!-- Input Area -->
                        <div class="p-4 md:p-6 bg-white border-t border-slate-200 relative shrink-0">
                            
                            <!-- Resources Popover -->
                            <div id="resources-popover" class="hidden absolute bottom-full left-4 mb-2 w-72 bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden z-20 animate-in fade-in slide-in-from-bottom-2">
                                <div class="p-3 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                                    <h4 class="text-sm font-semibold text-slate-800 flex items-center gap-2">
                                        <i data-lucide="folder-open" class="w-4 h-4 text-blue-600"></i> Case Resources
                                    </h4>
                                    <button onclick="toggleResources()" class="text-slate-400 hover:text-slate-600 p-1 rounded-md">
                                        <i data-lucide="x" class="w-4 h-4"></i>
                                    </button>
                                </div>
                                <div id="resources-list" class="max-h-60 overflow-y-auto p-2 space-y-1">
                                    <!-- Populated dynamically -->
                                </div>
                            </div>

                            <!-- Attached Docs Pills -->
                            <div id="attached-docs-container" class="flex flex-wrap gap-2 mb-3 px-1 hidden">
                                <!-- Populated dynamically -->
                            </div>

                            <form onsubmit="handleSendMessage(event)" class="relative flex items-end gap-2 bg-slate-50 rounded-2xl border border-slate-200 p-2 focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-400 transition-all shadow-inner">
                                <button type="button" onclick="toggleResources()" id="resource-toggle-btn" class="p-2.5 rounded-full transition-colors shrink-0 mb-0.5 bg-blue-600 text-white hover:bg-blue-700 shadow-sm" title="Attach Resource">
                                    <i data-lucide="folder-plus" class="w-[18px] h-[18px]"></i>
                                </button>
                                
                                <textarea id="chat-input" onkeydown="handleChatKeyDown(event)" placeholder="Ask a question about the case or general law..." class="w-full bg-transparent border-none focus:ring-0 outline-none resize-none max-h-32 min-h-[44px] py-2 px-2 text-sm text-slate-800" rows="1"></textarea>
                                
                                <button type="submit" id="chat-submit-btn" class="p-2.5 bg-slate-900 text-white rounded-xl hover:bg-slate-800 disabled:opacity-50 disabled:hover:bg-slate-900 transition-all shadow-sm shrink-0 mb-0.5">
                                    <i data-lucide="send" class="w-[18px] h-[18px]"></i>
                                </button>
                            </form>
                            
                            <div class="flex justify-between items-center mt-3 px-1">
                                <p class="text-[10px] font-medium text-slate-400 uppercase tracking-wide">
                                    AI responses require human verification.
                                </p>
                                <p class="text-[10px] text-slate-400">
                                    Press <kbd class="font-sans px-1 py-0.5 bg-slate-100 border border-slate-200 rounded">Enter</kbd> to send
                                </p>
                            </div>
                        </div>

                    </div>
                </div>
            `;
        }

        function renderChatMessages() {
            const container = document.getElementById('chat-messages-container');
            if (!container) return;

            let html = '';
            state.chatMessages.forEach(msg => {
                const isUser = msg.role === 'user';
                
                // Parse markdown for model responses
                const formattedText = isUser ? escapeHTML(msg.text) : marked.parse(msg.text);

                html += `
                    <div class="flex gap-4 ${isUser ? 'justify-end' : 'justify-start'} group">
                        ${!isUser ? `
                            <div class="w-8 h-8 rounded-lg bg-blue-50 border border-blue-100 flex items-center justify-center flex-shrink-0 mt-1 shadow-sm">
                                <i data-lucide="scale" class="w-4 h-4 text-blue-700"></i>
                            </div>
                        ` : ''}
                        
                        <div class="${isUser ? 'max-w-[85%] md:max-w-3xl bg-slate-900 text-white shadow-md rounded-2xl rounded-tr-[4px] px-5 py-4' : (msg.isError ? 'max-w-[85%] md:max-w-3xl bg-red-50 text-red-800 border border-red-200 rounded-2xl rounded-tl-[4px] px-5 py-4' : 'max-w-[85%] md:max-w-3xl bg-white border border-slate-200 text-slate-700 shadow-sm rounded-2xl rounded-tl-[4px] px-5 py-4 leading-relaxed')}">
                            <div class="prose prose-sm md:prose-base max-w-none ${isUser ? 'prose-user whitespace-pre-wrap' : 'text-slate-700'}">
                                ${formattedText}
                            </div>
                            
                            ${msg.sources && msg.sources.length > 0 ? `
                                <div class="mt-5 pt-4 border-t border-slate-100">
                                    <div class="flex items-center gap-2 mb-3">
                                        <i data-lucide="book-open" class="w-3.5 h-3.5 text-slate-400"></i>
                                        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Reference Sources</p>
                                    </div>
                                    <div class="flex flex-wrap gap-2">
                                        ${msg.sources.map(s => `
                                            <a href="${s.uri}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium text-slate-600 hover:text-blue-700 hover:bg-blue-50 hover:border-blue-200 transition-all shadow-sm max-w-[280px]" title="${s.title}">
                                                <i data-lucide="link" class="w-3 h-3 flex-shrink-0 text-slate-400"></i>
                                                <span class="truncate">${s.title}</span>
                                            </a>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}
                        </div>

                        ${isUser ? `
                            <div class="w-8 h-8 rounded-lg bg-slate-100 border border-slate-200 flex items-center justify-center flex-shrink-0 mt-1 shadow-sm">
                                <i data-lucide="user" class="w-4 h-4 text-slate-600"></i>
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            if (state.isChatLoading) {
                html += `
                    <div class="flex gap-4 justify-start animate-in fade-in" id="loading-indicator">
                        <div class="w-8 h-8 rounded-lg bg-blue-50 border border-blue-100 flex items-center justify-center flex-shrink-0 mt-1 shadow-sm">
                            <i data-lucide="scale" class="w-4 h-4 text-blue-700"></i>
                        </div>
                        <div class="bg-white border border-slate-200 text-slate-500 rounded-2xl rounded-tl-[4px] px-5 py-4 flex items-center gap-2 shadow-sm">
                            <span class="text-sm font-medium text-slate-500 mr-2">Researching</span>
                            <span class="w-1.5 h-1.5 bg-blue-500 rounded-full animate-bounce"></span>
                            <span class="w-1.5 h-1.5 bg-blue-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
                            <span class="w-1.5 h-1.5 bg-blue-500 rounded-full animate-bounce" style="animation-delay: 0.4s"></span>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            lucide.createIcons();
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-messages-container');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function toggleResources() {
            state.showResources = !state.showResources;
            updateResourcesPopoverUI();
        }

        function updateResourcesPopoverUI() {
            const popover = document.getElementById('resources-popover');
            const toggleBtn = document.getElementById('resource-toggle-btn');
            const listEl = document.getElementById('resources-list');
            
            if (!popover) return;

            if (state.showResources) {
                popover.classList.remove('hidden');
                toggleBtn.classList.add('bg-blue-800', 'ring-2', 'ring-blue-300');
                toggleBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');

                let listHtml = '';
                state.mockDocuments.forEach(doc => {
                    const isAttached = state.attachedDocs.some(d => d.id === doc.id);
                    listHtml += `
                        <div class="flex items-center justify-between p-2 hover:bg-slate-50 rounded-lg group transition-colors">
                            <div class="flex items-center gap-2 overflow-hidden pr-2">
                                <i data-lucide="file-text" class="w-3.5 h-3.5 text-slate-400 flex-shrink-0"></i>
                                <span class="text-xs font-medium text-slate-700 truncate">${doc.name}</span>
                            </div>
                            <button onclick="attachDocument(${doc.id})" ${isAttached ? 'disabled' : ''} class="p-1.5 rounded-md transition-colors flex-shrink-0 ${isAttached ? 'text-green-500 bg-green-50 cursor-default' : 'text-slate-400 hover:text-blue-600 hover:bg-blue-100'}">
                                <i data-lucide="${isAttached ? 'check' : 'plus'}" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    `;
                });
                listEl.innerHTML = listHtml;
                lucide.createIcons();
            } else {
                popover.classList.add('hidden');
                toggleBtn.classList.remove('bg-blue-800', 'ring-2', 'ring-blue-300');
                toggleBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
            }
        }

        function attachDocument(docId) {
            const doc = state.mockDocuments.find(d => d.id === docId);
            if (doc && !state.attachedDocs.some(d => d.id === docId)) {
                state.attachedDocs.push(doc);
                updateResourcesPopoverUI();
                updateAttachedDocsUI();
                
                // Focus back on input
                document.getElementById('chat-input')?.focus();
            }
        }

        function removeAttachedDocument(docId) {
            state.attachedDocs = state.attachedDocs.filter(d => d.id !== docId);
            updateResourcesPopoverUI();
            updateAttachedDocsUI();
        }

        function updateAttachedDocsUI() {
            const container = document.getElementById('attached-docs-container');
            const submitBtn = document.getElementById('chat-submit-btn');
            const inputEl = document.getElementById('chat-input');
            if (!container) return;

            if (state.attachedDocs.length > 0) {
                container.classList.remove('hidden');
                let html = '';
                state.attachedDocs.forEach(doc => {
                    html += `
                        <div class="flex items-center gap-1.5 bg-blue-50 border border-blue-100 text-blue-700 text-xs font-medium px-2.5 py-1.5 rounded-full animate-in fade-in slide-in-from-bottom-1">
                            <i data-lucide="file-text" class="w-3 h-3"></i>
                            <span class="max-w-[150px] truncate">${doc.name}</span>
                            <button type="button" onclick="removeAttachedDocument(${doc.id})" class="hover:bg-blue-200 text-blue-500 hover:text-blue-800 rounded-full p-0.5 transition-colors ml-1">
                                <i data-lucide="x" class="w-3 h-3"></i>
                            </button>
                        </div>
                    `;
                });
                container.innerHTML = html;
                lucide.createIcons();
            } else {
                container.classList.add('hidden');
                container.innerHTML = '';
            }
            
            // Check submit button state
            validateChatSubmit();
        }

        function handleChatKeyDown(e) {
            validateChatSubmit();
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendMessage(e);
            }
        }

        function validateChatSubmit() {
            const submitBtn = document.getElementById('chat-submit-btn');
            const inputEl = document.getElementById('chat-input');
            if(submitBtn && inputEl) {
                 const hasText = inputEl.value.trim().length > 0;
                 const hasDocs = state.attachedDocs.length > 0;
                 submitBtn.disabled = (!hasText && !hasDocs) || state.isChatLoading;
            }
        }

        async function handleSendMessage(e) {
            e.preventDefault();
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            
            if ((!text && state.attachedDocs.length === 0) || state.isChatLoading) return;

            let messageText = text;
            if (state.attachedDocs.length > 0) {
                const docNames = state.attachedDocs.map(d => d.name).join(', ');
                messageText = `[User attached the following reference documents for context: ${docNames}]\n\n${text}`;
            }

            // Update State
            const userMessage = { role: 'user', text: messageText };
            state.chatMessages.push(userMessage);
            
            // Reset UI instantly
            inputEl.value = '';
            state.attachedDocs = [];
            state.showResources = false;
            state.isChatLoading = true;
            
            updateResourcesPopoverUI();
            updateAttachedDocsUI();
            renderChatMessages(); // Shows user message and loading indicator

            try {
                const systemPrompt = `You are an expert legal research assistant. You are helping a legal professional with a case.
                Case Context: ${state.selectedCase.title}.
                Provide accurate, concise, and professional legal information. 
                Use the Google Search tool to find relevant real-time case law, statutes, and legal news when applicable. 
                Always cite your sources if you pull information from a specific case or statute.
                If you are unsure, state that clearly and suggest terms the user might want to research further.
                Format responses cleanly in Markdown.`;

                const payload = {
                    contents: state.chatMessages.filter(m => !m.isError).map(m => ({
                        role: m.role,
                        parts: [{ text: m.text }]
                    })),
                    tools: [{ "google_search": {} }],
                    systemInstruction: {
                        parts: [{ text: systemPrompt }]
                    },
                };

                const apiKey = ""; // API key is injected by the environment
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const replyText = candidate.content.parts[0].text;
                    
                    let sources = [];
                    const groundingMetadata = candidate.groundingMetadata;
                    if (groundingMetadata && groundingMetadata.groundingAttributions) {
                        sources = groundingMetadata.groundingAttributions
                            .map(attribution => ({
                                uri: attribution.web?.uri,
                                title: attribution.web?.title,
                            }))
                            .filter(source => source.uri && source.title);
                    }

                    state.chatMessages.push({ role: 'model', text: replyText, sources });
                } else {
                    throw new Error("Empty response");
                }
            } catch (error) {
                console.error("Error communicating with AI:", error);
                state.chatMessages.push({ role: 'model', text: "There was a network error communicating with the AI service. Please ensure you are connected and try again.", isError: true });
            } finally {
                state.isChatLoading = false;
                renderChatMessages(); // Re-render to show final response and remove loader
            }
        }

        function getDraftingHTML() {
            return `
                <div class="h-full flex flex-col lg:flex-row gap-6 animate-in fade-in duration-300">
                    <!-- Left Panel: Parameters -->
                    <div class="w-full lg:w-1/3 bg-white rounded-2xl border border-slate-200 shadow-sm p-6 flex flex-col h-1/2 lg:h-full overflow-y-auto shrink-0">
                        <h2 class="text-xl font-bold text-slate-900 mb-2">Drafting Parameters</h2>
                        <p class="text-sm text-slate-500 mb-6">
                            Provide notes, facts, and intended arguments. The AI will structure them into a formal legal draft.
                        </p>
                        
                        <div class="space-y-6 flex-1 flex flex-col">
                            <div class="flex-1 flex flex-col min-h-[200px]">
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Rough Notes & Key Points</label>
                                <textarea id="drafting-notes" oninput="updateDraftingNotes(event)" placeholder="E.g., Defendant failed to deliver goods by July 1st. Email evidence attached shows they acknowledged the delay..." class="w-full flex-1 p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none resize-none bg-slate-50 focus:bg-white transition-colors text-sm">${state.draftNotes}</textarea>
                            </div>
                            
                            <button onclick="handleGenerateDraft()" id="draft-submit-btn" ${state.isDrafting || !state.draftNotes.trim() ? 'disabled' : ''} class="w-full flex items-center justify-center gap-2 bg-slate-900 text-white px-6 py-3 rounded-xl hover:bg-slate-800 disabled:opacity-50 transition-all font-semibold shadow-md active:scale-[0.98]">
                                ${state.isDrafting ? '<i data-lucide="loader-2" class="w-[18px] h-[18px] animate-spin"></i> Generating Draft...' : '<i data-lucide="bot" class="w-[18px] h-[18px]"></i> Generate First Draft'}
                            </button>
                        </div>
                    </div>

                    <!-- Right Panel: Editor -->
                    <div class="flex-1 bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col overflow-hidden h-1/2 lg:h-full">
                        <div class="p-4 border-b border-slate-100 bg-white flex justify-between items-center shrink-0">
                            <h3 class="font-bold text-slate-900 flex items-center gap-2">
                                <i data-lucide="file-text" class="w-[18px] h-[18px] text-blue-600"></i> Editor
                            </h3>
                            <button class="flex items-center gap-1.5 text-sm text-slate-700 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-lg transition-colors font-semibold shadow-sm border border-slate-200">
                                <i data-lucide="save" class="w-4 h-4"></i> Save Draft
                            </button>
                        </div>
                        <div class="flex-1 p-0 relative bg-slate-50/30 overflow-hidden">
                            <textarea id="drafting-output" oninput="state.draftOutput = this.value" placeholder="Your generated draft will appear here ready for editing." class="w-full h-full p-8 outline-none resize-none font-serif text-slate-800 leading-relaxed bg-transparent absolute inset-0">${state.draftOutput}</textarea>
                            
                            ${!state.draftOutput && !state.isDrafting ? `
                                <div class="absolute inset-0 flex items-center justify-center pointer-events-none" id="draft-empty-state">
                                    <div class="text-slate-400 flex flex-col items-center gap-4 bg-white/50 p-8 rounded-full">
                                        <div class="p-4 bg-slate-100 rounded-full"><i data-lucide="file-text" class="w-8 h-8 text-slate-300"></i></div>
                                        <p class="font-medium text-slate-500">Document workspace is empty</p>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function updateDraftingNotes(e) {
            state.draftNotes = e.target.value;
            const btn = document.getElementById('draft-submit-btn');
            if(btn) btn.disabled = state.isDrafting || !state.draftNotes.trim();
        }

        async function handleGenerateDraft() {
            if (!state.draftNotes.trim() || state.isDrafting) return;
            
            state.isDrafting = true;
            renderContent(); // Re-render to show loading state

            try {
                const systemPrompt = `You are an expert legal drafter. Based on the user's notes and the case context, draft a formal legal submission or document section. 
                Use professional legal terminology and structure. Output ONLY the drafted text.`;
                
                const userPrompt = `Case: ${state.selectedCase.title}\n\nPlease generate a draft based on these notes:\n${state.draftNotes}`;

                const payload = {
                    contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                };

                const apiKey = ""; // API key injected by environment
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("Drafting API failed");
                const result = await response.json();
                
                if (result.candidates?.[0]?.content?.parts?.[0]?.text) {
                    state.draftOutput = result.candidates[0].content.parts[0].text;
                } else {
                    state.draftOutput = "Error: Could not generate draft. Please try again.";
                }
            } catch (err) {
                console.error("Drafting error:", err);
                state.draftOutput = "An error occurred while generating the draft.";
            } finally {
                state.isDrafting = false;
                renderContent(); // Show final result
            }
        }

        // Utility to escape HTML in user messages
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

    </script>
</body>
</html>
